# Test the python-package-template cookiecutter template across parameter
# permutations. Scoped to this subdirectory so unrelated changes elsewhere
# in the monorepo don't trigger it.

name: Test python-package-template

on:
  push:
    branches: [main]
    paths: ["python-package-template/**", ".github/workflows/test-python-package-template.yml"]
  pull_request:
    branches: [main]
    paths: ["python-package-template/**", ".github/workflows/test-python-package-template.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: python-package-template

jobs:
  # Fast tests: file existence, feature toggles, YAML validity, Jinja leak detection
  test-matrix:
    name: Test template generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "python-package-template/pyproject.toml"

      - name: Install Python
        run: uv python install 3.14

      - name: Install testing dependencies
        run: uv sync --all-groups

      - name: Run template tests (fast)
        run: uv run pytest tests/ -n auto -v -m "not slow"

  # Slow tests: actually run uv sync inside generated projects
  test-integration:
    name: Integration tests (uv sync)
    runs-on: ubuntu-latest
    needs: test-matrix
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          # Same cache-dependency-glob as test-matrix's setup-uv step above ->
          # identical cache key. test-matrix already saves it; a second save
          # attempt here for the same key is rejected by the cache API (harmless,
          # but noisy: "Failed to save: Unable to reserve cache ... another job
          # may be creating this cache"). Nothing runs after this job, so it only
          # needs to restore, never save.
          save-cache: false
          cache-dependency-glob: "python-package-template/pyproject.toml"

      - name: Install Python
        run: uv python install 3.14

      - name: Install testing dependencies
        run: uv sync --all-groups

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run integration tests
        run: uv run pytest tests/ -v -m slow --run-slow
