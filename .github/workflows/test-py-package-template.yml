# Test the py-package-template cookiecutter template across parameter
# permutations. Scoped to this subdirectory so unrelated changes elsewhere
# in the monorepo don't trigger it.

name: Test py-package-template

on:
  push:
    branches: [main]
    paths: ["py-package-template/**"]
  pull_request:
    branches: [main]
    paths: ["py-package-template/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: py-package-template

jobs:
  # Fast tests: file existence, feature toggles, YAML validity, Jinja leak detection
  test-matrix:
    name: Test template generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.12"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install testing dependencies
        run: uv sync --all-groups

      - name: Run template tests (fast)
        run: uv run pytest tests/ -n auto -v -m "not slow"

  # Slow tests: actually run uv sync inside generated projects
  test-integration:
    name: Integration tests (uv sync)
    runs-on: ubuntu-latest
    needs: test-matrix
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.12"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install testing dependencies
        run: uv sync --all-groups

      - name: Run integration tests
        run: uv run pytest tests/ -v -m slow --run-slow
