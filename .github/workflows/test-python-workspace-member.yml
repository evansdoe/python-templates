# Test the python-workspace-member cookiecutter template across parameter
# permutations. Scoped to this subdirectory so unrelated changes elsewhere
# in the monorepo don't trigger it.
#
# Triggers on python-workspace-template changes too: this template's own slow
# integration test bakes into a real python-workspace-template workspace, and
# now that both live in the same checkout it can actually run instead of
# skipping for lack of a WORKSPACE_TEMPLATE_PATH.

name: Test python-workspace-member

on:
  push:
    branches: [main]
    paths: ["python-workspace-member/**", "python-workspace-template/**", ".github/workflows/test-python-workspace-member.yml"]
  pull_request:
    branches: [main]
    paths: ["python-workspace-member/**", "python-workspace-template/**", ".github/workflows/test-python-workspace-member.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: python-workspace-member

jobs:
  # Fast tests: file existence, feature toggles, YAML validity, Jinja leak detection
  test-matrix:
    name: Test template generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "python-workspace-member/pyproject.toml"

      - name: Install Python
        run: uv python install 3.14

      - name: Install testing dependencies
        run: uv sync --all-groups

      - name: Run template tests (fast)
        run: uv run pytest tests/ -n auto -v -m "not slow"

  # Slow tests: bakes this member into a real python-workspace-template workspace
  # and runs uv sync over the pair.
  test-integration:
    name: Integration tests (uv sync)
    runs-on: ubuntu-latest
    needs: test-matrix
    env:
      WORKSPACE_TEMPLATE_PATH: ${{ github.workspace }}/python-workspace-template
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          # Same cache-dependency-glob as test-matrix's setup-uv step above ->
          # identical cache key. test-matrix already saves it; a second save
          # attempt here for the same key is rejected by the cache API (harmless,
          # but noisy: "Failed to save: Unable to reserve cache ... another job
          # may be creating this cache"). Nothing runs after this job, so it only
          # needs to restore, never save.
          save-cache: false
          cache-dependency-glob: "python-workspace-member/pyproject.toml"

      - name: Install Python
        run: uv python install 3.14

      - name: Install testing dependencies
        run: uv sync --all-groups

      - name: Run integration tests
        run: uv run pytest tests/ -v -m slow --run-slow
