# Test the python-workspace-template cookiecutter template across parameter
# permutations. Scoped to this subdirectory so unrelated changes elsewhere
# in the monorepo don't trigger it.

name: Test python-workspace-template

on:
  push:
    branches: [main]
    paths: ["python-workspace-template/**", ".github/workflows/test-python-workspace-template.yml"]
  pull_request:
    branches: [main]
    paths: ["python-workspace-template/**", ".github/workflows/test-python-workspace-template.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: python-workspace-template

jobs:
  # Fast tests: file existence, feature toggles, YAML validity, Jinja leak detection
  test-matrix:
    name: Test template generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "python-workspace-template/pyproject.toml"

      - name: Install Python
        run: uv python install 3.14

      - name: Install testing dependencies
        run: uv sync --all-groups

      - name: Run template tests (fast)
        run: uv run pytest tests/ -n auto -v -m "not slow"

  # Slow tests: actually run uv sync inside generated workspaces
  test-integration:
    name: Integration tests (uv sync)
    runs-on: ubuntu-latest
    needs: test-matrix
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "python-workspace-template/pyproject.toml"

      - name: Install Python
        run: uv python install 3.14

      - name: Install testing dependencies
        run: uv sync --all-groups

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run integration tests
        run: uv run pytest tests/ -v -m slow --run-slow
