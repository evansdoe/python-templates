pytest:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["{{ cookiecutter.min_python_version }}", "{{ cookiecutter.python_version }}"]
  script:
    - uv python install $PYTHON_VERSION
    - uv sync --no-default-groups --group test --python $PYTHON_VERSION
    - uv run --no-sync pytest --cov --cov-report=xml --cov-report=term --junitxml=report.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
