build:
  stage: build
  script:
    - uv build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
{%- if cookiecutter.publish_to_pypi == "yes" %}

publish:
  stage: publish
  needs: [build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    # Set UV_PUBLISH_TOKEN as a masked, protected CI/CD variable (a PyPI API token).
    - uv publish
{%- endif %}
