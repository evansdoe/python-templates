name: CI

on:
  push:
    branches: [main]
  pull_request:
{%- if cookiecutter.include_danger == "yes" %}
    # Danger judges the title and the description, so the job has to re-run
    # when either is edited. GitHub's default types are opened, synchronize
    # and reopened only, which leaves a corrected title failing until someone
    # pushes a commit.
    types: [opened, synchronize, reopened, edited]
{%- endif %}
  workflow_dispatch:

concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

env:
  UV_VERSION: "{{ cookiecutter.uv_version }}"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: {% raw %}${{ env.UV_VERSION }}{% endraw %}
          enable-cache: true
      - run: uv sync --no-default-groups --only-group lint
      - name: ruff format
        run: uv run --no-sync ruff format --check .
      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .
{%- if cookiecutter.type_checker != "none" %}

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: {% raw %}${{ env.UV_VERSION }}{% endraw %}
          enable-cache: true
      # mypy checks tests/ too, so the tests' dependencies must be present.
      - run: uv sync --no-default-groups --group lint --group test
{%- if cookiecutter.type_checker == "mypy" %}
      - run: uv run --no-sync mypy
{%- else %}
      - run: uv run --no-sync ty check
{%- endif %}
{%- endif %}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["{{ cookiecutter.min_python_version }}"{% if cookiecutter.python_version != cookiecutter.min_python_version %}, "{{ cookiecutter.python_version }}"{% endif %}]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: {% raw %}${{ env.UV_VERSION }}{% endraw %}
          enable-cache: true
          python-version: {% raw %}${{ matrix.python-version }}{% endraw %}
      - run: uv sync --no-default-groups --group test
      - run: uv run --no-sync pytest --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: {% raw %}${{ matrix.python-version == '{% endraw %}{{ cookiecutter.python_version }}{% raw %}' }}{% endraw %}
        with:
          name: coverage
          path: coverage.xml

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: {% raw %}${{ env.UV_VERSION }}{% endraw %}
          enable-cache: true
      - run: uv sync --no-default-groups --group license
      - run: uv run --no-sync licensecheck
{%- if cookiecutter.include_docs == "yes" %}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: {% raw %}${{ env.UV_VERSION }}{% endraw %}
          enable-cache: true
      - run: uv sync --no-default-groups --group docs
      - run: uv run --no-sync mkdocs build --strict
{%- endif %}

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: {% raw %}${{ env.UV_VERSION }}{% endraw %}
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
{%- if cookiecutter.include_danger == "yes" %}

  danger:
    runs-on: ubuntu-latest
    # Danger reads the pull request and posts a comment. Without this the
    # default workflow token carries no pull-requests scope and every API
    # call fails with 403 "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: scripts/danger/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: scripts/danger
      - run: pnpm lint
        working-directory: scripts/danger
      - run: pnpm format
        working-directory: scripts/danger
      - run: pnpm danger ci --failOnErrors
        working-directory: scripts/danger
        env:
          GITHUB_TOKEN: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
{%- endif %}
