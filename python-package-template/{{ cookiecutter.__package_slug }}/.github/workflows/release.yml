name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
{%- if cookiecutter.publish_to_pypi == "yes" %}
  id-token: write
{%- endif %}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "{{ cookiecutter.uv_version }}"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
{%- if cookiecutter.publish_to_pypi == "yes" %}

  pypi:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/p/{{ cookiecutter.__package_slug }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Configure a Trusted Publisher for this repo at https://pypi.org/manage/account/publishing/
      - uses: pypa/gh-action-pypi-publish@release/v1
{%- endif %}
