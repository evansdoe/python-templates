site_name: {{ cookiecutter.package_name }}
site_description: {{ cookiecutter.package_description }}
repo_url: {{ cookiecutter.__repo_url }}

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

nav:
  - Home: index.md
  - API: api.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
