# Workspace root pipeline.
#
# Lint / type checks / license audit run once over the whole workspace.
# Tests run per member: the `generate` job writes a child pipeline containing
# only the members affected by this change, so adding a project under
# projects/ never requires editing this file.

stages:
  - lint
  - prepare
  - test

variables:
  UV_IMAGE: "ghcr.io/astral-sh/uv:python{{ cookiecutter.python_version }}-bookworm-slim"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: "copy"
  GIT_DEPTH: "0"

default:
  image: $UV_IMAGE
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - uv --version

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

include:
  - local: .gitlab/ci/lint.yml
  - local: .gitlab/ci/triggers.yml
{%- if cookiecutter.include_danger == "yes" %}
  - local: .gitlab/ci/danger.yml
{%- endif %}
