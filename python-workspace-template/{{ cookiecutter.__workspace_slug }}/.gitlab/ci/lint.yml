ruff:
  stage: lint
  script:
    - uv sync --no-default-groups --only-group lint
    - uv run --no-sync ruff format --check .
    - uv run --no-sync ruff check --output-format=gitlab > code-quality.json || true
    - uv run --no-sync ruff check .
  artifacts:
    reports:
      codequality: code-quality.json
    when: always
{%- if cookiecutter.type_checker != "none" %}

types:
  stage: lint
  script:
    # The type checker reads tests/ too, so the tests' dependencies must be present.
    - uv sync --all-packages --no-default-groups --group lint --group test
{%- if cookiecutter.type_checker == "mypy" %}
    - uv run --no-sync python scripts/ci/run_mypy.py
{%- else %}
    - uv run --no-sync ty check
{%- endif %}
{%- endif %}

licenses:
  stage: lint
  script:
    - uv sync --all-packages --no-default-groups --group license
    - uv run --no-sync licensecheck
